name: improvy
description: "Improvy - Music Interval Trainer"
publish_to: 'none'

version: 1.6.2+66

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  go_router: ^14.6.2
  fl_chart: ^0.69.0
  confetti: ^0.7.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  purchases_flutter: ^10.3.0
  purchases_ui_flutter: ^10.3.0
  posthog_flutter: ^5.24.0
  # Local scheduled notifications (daily reminder / comeback). No web support —
  # all usage goes through lib/services/notification_service.dart, whose
  # conditional import keeps the web build compiling with a no-op stub.
  flutter_local_notifications: ^18.0.1
  timezone: ">=0.9.0 <0.11.0"
  # Pocket Mode speaks with recorded clips of the author's own voice (see
  # lib/services/voice_service.dart), not a synthesised one — so audioplayers
  # below covers both the speech and the keep-alive.
  #
  # Pocket Mode's background keep-alive. iOS only leaves a backgrounded app
  # running while audio is actually FLOWING — an active session with nothing
  # playing gets suspended, which froze the loop during its silent gaps. This
  # plays an inaudible track on repeat for the whole session so the output
  # never goes idle. See lib/services/keep_alive_audio.dart.
  audioplayers: ^6.1.0
  # Opens the user's mail app from Contact Support (see constants/app_info.dart).
  url_launcher: ^6.3.1
  # Native share sheet for the Daily Challenge result (Wordle-style text grid).
  share_plus: ^10.1.0
  # Native store-rating sheet, asked only at a peak moment — see
  # lib/services/review_service.dart.
  in_app_review: ^2.0.9
  # Home-screen widgets. The Dart side writes their payload into shared
  # storage; the native widgets (android/…/ImprovyWidgets.kt and
  # ios/ImprovyWidget/) only render it. See lib/services/widget_service.dart.
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/audio/voice/

  fonts:
    - family: NotoMusic
      fonts:
        - asset: assets/fonts/NotoMusic-Regular.ttf
    # SMuFL music font — its ♯ (U+E262) and ♭ (U+E260) are the exact glyphs the
    # Chromatic tile's interlocked mark is drawn from (design 20c). Bundled
    # because those SMuFL codepoints exist only here, not in NotoMusic.
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Light.ttf
          weight: 300
        - asset: assets/fonts/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lexend-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Lexend-Black.ttf
          weight: 900
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
