# ─────────────────────────────────────────────────────────────────────────────
# Improvy — iOS build & TestFlight on Codemagic (no Mac).
#
# Signing strategy: because a distribution certificate's PRIVATE KEY only exists
# where the cert was first created, any pre-existing cert in the Apple account is
# unusable on this build machine ("Cannot save Signing Certificates without
# certificate private key"). So the build itself deletes existing distribution
# certificates via the App Store Connect API and mints a fresh one whose private
# key it generates and keeps — then creates the matching App Store profile.
# ─────────────────────────────────────────────────────────────────────────────
workflows:
  ios-testflight:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: chiaveapipercodemagic
    environment:
      vars:
        APP_STORE_APPLE_ID: 6775236759
        BUNDLE_ID: "com.improvy.app"
        # The WidgetKit extension is its own bundle and needs its own profile.
        # Both App IDs must have the App Groups capability enabled in the Apple
        # developer account, carrying group.com.improvy.app.widget. Enabling it
        # is a manual step — nothing here can do it — and a profile minted
        # before it was enabled never gains it, so that profile has to be
        # deleted once. Without all that the build dies at signing with
        # "doesn't include the App Groups capability", right after the archive
        # succeeds. ios/ImprovyWidget/README.md has the four clicks.
        WIDGET_BUNDLE_ID: "com.improvy.app.ImprovyWidget"
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      # Nothing ships red. Both are cheap next to the Xcode build that follows,
      # and a failing test that reaches TestFlight costs a whole review cycle.
      #
      # --no-fatal-infos only spares the style lints; warnings still fail the
      # build, which is the point — dead code and unused parameters are how a
      # refactor leaves litter behind. If this ever goes red on a warning, the
      # fix is to delete the dead thing, not to widen the flag.
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      # Apple scans the binary for APIs that touch private data and rejects
      # the upload when a purpose string is missing — build 35 of 1.14.0 went
      # that way over a file picker that links the photo library. Catching it
      # here costs a second; catching it at Apple costs a day.
      - name: iOS privacy check
        script: flutter test --tags ios --run-skipped

      # Signing, two ways.
      #
      # PREFERRED — set CERTIFICATE_PRIVATE_KEY in the Codemagic environment
      # (Codemagic → app → Environment variables, group "signing", secure):
      # the PEM of one RSA key you generated once and keep. Every build then
      # reuses the same certificate, nothing in the Apple account is touched,
      # and any other machine holding that key can sign too.
      #
      # FALLBACK — the variable is unset: the build mints a throwaway key,
      # deletes every distribution certificate in the account so that a new
      # one can be issued, and signs with it. That works, and it is what the
      # app shipped with, but it wipes out every other pipeline or Mac in the
      # account on every run. It stays only so a build cannot fail for want of
      # a variable; it is not how this should run.
      - name: Signing — reuse our certificate, or mint one if none is kept
        script: |
          set -e
          keychain initialize
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Using the kept private key; no certificate is deleted."
            for B in "$BUNDLE_ID" "$WIDGET_BUNDLE_ID"; do
              app-store-connect fetch-signing-files "$B" \
                --type IOS_APP_STORE \
                --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
                --create
            done
          else
            echo "WARNING: CERTIFICATE_PRIVATE_KEY is not set — falling back to the destructive path."
            echo "Removing existing distribution certificates (we don't hold their private keys)..."
            for T in IOS_DISTRIBUTION DISTRIBUTION; do
              app-store-connect certificates list --type "$T" --json 2>/dev/null | jq -r '.[].id' 2>/dev/null || true
            done | sort -u | while read -r cid; do
              if [ -n "$cid" ]; then
                echo "  deleting certificate $cid"
                app-store-connect certificates delete "$cid" || true
              fi
            done
            openssl genrsa -out /tmp/cert_key.pem 2048
            for B in "$BUNDLE_ID" "$WIDGET_BUNDLE_ID"; do
              app-store-connect fetch-signing-files "$B" \
                --type IOS_APP_STORE \
                --certificate-key=@file:/tmp/cert_key.pem \
                --create
            done
          fi
          keychain add-certificates
          xcode-project use-profiles

      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;

      - name: Build signed IPA (build number = latest TestFlight + 1)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          flutter build ipa --release \
            --build-number=$(($LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - lorenzo.ballestrazzi07@gmail.com
        notify:
          success: true
          failure: true
