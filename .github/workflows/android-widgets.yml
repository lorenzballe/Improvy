name: Android widgets check

# Builds the app and draws the twelve REAL Android widgets on an emulator —
# the RemoteViews a launcher gets, with the payload the app really writes —
# then publishes the pictures to the `android-widget-renders` branch.

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/app/src/main/kotlin/com/improvy/improvy/ImprovyWidgets.kt"
      - "android/app/src/main/res/layout/widget_*.xml"
      - "android/app/src/main/res/drawable/w_*.xml"
      - "android/app/src/main/res/values/widget_strings.xml"
      - "android/app/src/androidTest/**"
      - "lib/services/widget_service.dart"
      - ".github/workflows/android-widgets.yml"

permissions:
  contents: write

concurrency:
  group: android-widgets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Payload the app writes
        run: |
          flutter pub get
          flutter test test/widget_payload_test.dart --run-skipped
          mkdir -p android/app/src/androidTest/assets
          cp build/widget_payload/*.json android/app/src/androidTest/assets/

      - name: Build app and render test
        run: |
          flutter build apk --debug
          cd android
          ./gradlew --no-daemon app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: bash android/tool/render_widgets.sh out

      - name: Publish renders
        if: always()
        run: |
          set -e
          mkdir -p out
          cp -R out "$RUNNER_TEMP/out"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout --orphan android-widget-renders
          git rm -rf -q . > /dev/null
          rm -rf ./* .dart_tool 2>/dev/null || true
          cp -R "$RUNNER_TEMP/out/." .
          echo "$GITHUB_SHA" > COMMIT
          git add -A
          git commit -q -m "Android widget renders for $GITHUB_SHA"
          git push -f origin android-widget-renders
