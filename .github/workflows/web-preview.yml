name: Web Preview

# Builds the Flutter app for web and publishes it to GitHub Pages so the
# latest UI can be previewed from any browser (phone included).
on:
  push:
    branches:
      - main
      - claude/response-time-per-game-ge4ez5
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time. Queued, NOT cancelled: main and the
# working branch share this group, so a push to both — which is what shipping
# looks like here — used to have the second run kill the first. The site still
# ended up correct (same commit, either run deploys it), but every push left a
# red "cancelled" run on main that looked like a broken build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        # --base-href must match the Pages sub-path: https://<user>.github.io/Improvy/
        run: flutter build web --release --base-href /Improvy/

      - name: Publish build to web-build branch
        # Sandboxed dev environments can't reach *.github.io or the Actions
        # artifact store, but can fetch branches over git — so the built site
        # is also force-pushed to a throwaway branch for local previews.
        run: |
          cd build/web
          git init -q -b web-build
          git -c user.name=github-actions -c user.email=github-actions@github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -q -m "Web build of ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # Only main is ever published.
  #
  # On 27 Aug a push to claude/github-mobile-editing-rvr8qr — 94 commits behind
  # main, last touched in July — ran this workflow from its OWN copy of the
  # file, which lists that branch, and its build went live on the same Pages
  # URL. The site then showed a July build for three days while main was ten
  # releases ahead. Every branch shares one site, so the last branch to run
  # wins no matter how old it is.
  #
  # Building on a branch is still useful (it force-pushes to web-build, which
  # is how a preview is fetched in a sandbox); publishing from one is not.
  #
  # NOTE: this guard travels with the file, so it cannot protect against a
  # stale branch carrying an older copy. That needs the github-pages
  # environment's deployment branch policy set to main only, in repo settings.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
