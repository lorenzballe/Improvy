name: Firebase

# Deploys the server side of the website purchase — the Cloud Functions in
# functions/ and the Firestore rules — whenever either changes on main.
#
# Everything the deploy needs is a repository secret, so nothing here is ever
# run by hand and no machine has to have the Firebase CLI on it:
#
#   FIREBASE_SERVICE_ACCOUNT  the JSON key of a service account that may deploy
#                             (Firebase console → Project settings → Service
#                             accounts → Generate new private key)
#   STRIPE_SECRET_KEY         sk_live_… (or sk_test_… while trying it out)
#   STRIPE_WEBHOOK_SECRET     whsec_… from the webhook endpoint in Stripe
#   REVENUECAT_WEBHOOK_AUTH   optional: any long random word, the same one
#                             pasted into RevenueCat's webhook Authorization
#                             header. Unset, that webhook refuses everything.
#
# Both are copied into Secret Manager on every run, so rotating one is:
# change the repository secret, re-run this workflow. STRIPE_SETUP.md walks
# through where each comes from.
#
# There is deliberately no price id here: the checkout describes the product
# itself, price and icon included, so there is nothing to create in a
# dashboard and nothing to keep in step. functions/.env can point at a Stripe
# catalogue price instead.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The runtime the functions are deployed on, so the tests run on
          # what will actually execute them.
          node-version: 20

      - name: Install the functions
        run: npm ci --no-audit --no-fund
        working-directory: functions

      - name: Test the functions
        run: npm test
        working-directory: functions

      - name: Sign in to Firebase
        # The CLI picks the key up from GOOGLE_APPLICATION_CREDENTIALS. It is
        # read from the environment rather than pasted into the script: a
        # value interpolated into a shell line has to survive the shell's
        # quoting, and a key that does not is a key that silently becomes
        # something else.
        #
        # It is also checked here rather than left to the CLI, whose answer to
        # every bad key is "have you run firebase login?" — a question with no
        # useful answer when the key came from a repository secret.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::repository secret FIREBASE_SERVICE_ACCOUNT is not set — Firebase console → Project settings → Service accounts → Generate new private key, then paste the whole .json. See STRIPE_SETUP.md."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          node -e '
            const fs = require("fs");
            const path = process.env.RUNNER_TEMP + "/firebase-sa.json";
            let key;
            try {
              key = JSON.parse(fs.readFileSync(path, "utf8"));
            } catch {
              console.log("::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Paste the whole file, from the first { to the last }, with nothing before or after.");
              process.exit(1);
            }
            for (const field of ["type", "project_id", "private_key", "client_email"]) {
              if (!key[field]) {
                console.log(`::error::FIREBASE_SERVICE_ACCOUNT is JSON but has no ${field} — that is not a service account key.`);
                process.exit(1);
              }
            }
            if (key.type !== "service_account") {
              console.log(`::error::FIREBASE_SERVICE_ACCOUNT is a ${key.type}, not a service_account key.`);
              process.exit(1);
            }
            if (key.project_id !== "improvy-f470f") {
              console.log(`::error::FIREBASE_SERVICE_ACCOUNT belongs to project ${key.project_id}, not improvy-f470f.`);
              process.exit(1);
            }
            // Identifies the key without revealing anything that unlocks it.
            console.log(`Signing in as ${key.client_email}`);
          '
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Put the Stripe secrets where the functions read them
        # Written from stdin, never from the command line, so they do not
        # appear in the process list or the log.
        run: |
          set -e
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::repository secret $name is not set — see STRIPE_SETUP.md"
              exit 1
            fi
            printf '%s' "$value" | npx --yes firebase-tools@14 functions:secrets:set "$name" \
              --project improvy-f470f --data-file - --force
          done

          # RevenueCat's webhook is optional: the app and the site work without
          # it, they just do not share one record of who is Pro. A deploy must
          # not fail for want of it — but the secret has to exist, or the
          # function cannot start. Unset, it gets a fresh random value nobody
          # holds, which leaves the endpoint closed rather than open.
          if [ -z "$REVENUECAT_WEBHOOK_AUTH" ]; then
            echo "::notice::REVENUECAT_WEBHOOK_AUTH is not set — the RevenueCat webhook will refuse every call. See STRIPE_SETUP.md."
            REVENUECAT_WEBHOOK_AUTH="unset-$(openssl rand -hex 32)"
          fi
          printf '%s' "$REVENUECAT_WEBHOOK_AUTH" | npx --yes firebase-tools@14 functions:secrets:set REVENUECAT_WEBHOOK_AUTH \
            --project improvy-f470f --data-file - --force
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          REVENUECAT_WEBHOOK_AUTH: ${{ secrets.REVENUECAT_WEBHOOK_AUTH }}

      - name: Deploy functions and rules
        run: |
          npx --yes firebase-tools@14 deploy \
            --only functions,firestore:rules \
            --project improvy-f470f \
            --non-interactive --force

      - name: Where the webhook lives
        # Stripe needs this URL once. It is printed here so nobody has to go
        # and find it.
        run: |
          echo "Stripe webhook endpoint:"
          echo "  https://europe-west1-improvy-f470f.cloudfunctions.net/stripeWebhook"
          echo "RevenueCat webhook endpoint:"
          echo "  https://europe-west1-improvy-f470f.cloudfunctions.net/revenueCatWebhook"
